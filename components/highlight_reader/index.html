<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script src="https://unpkg.com/streamlit-component-lib@1.4.0/dist/index.js"></script>
  <style>
    :root {
      --border: #e5e7eb;
      --bg: #ffffff;
      --toolbar: #f8fafc;
      --text: #111827;
      --muted: #6b7280;
      --primary: #7c3aed;
      --danger: #dc2626;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 9999;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px;
      background: rgba(248, 250, 252, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    button, select {
      border: 1px solid var(--border);
      background: white;
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 14px;
      cursor: pointer;
    }

    button.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    button.danger {
      color: var(--danger);
    }

    .status {
      font-size: 13px;
      color: var(--muted);
      margin-left: auto;
    }

    #reader {
      padding: 18px 20px 80px;
      max-width: 1050px;
      margin: 0 auto;
      line-height: 1.55;
    }

    .med-highlight {
      border-radius: 3px;
      padding: 0 1px;
      cursor: pointer;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .med-highlight.selected {
      outline: 2px solid #111827;
      outline-offset: 2px;
    }

    .hl-yellow { background: rgba(250, 204, 21, 0.55); }
    .hl-green  { background: rgba(134, 239, 172, 0.55); }
    .hl-blue   { background: rgba(147, 197, 253, 0.55); }
    .hl-pink   { background: rgba(249, 168, 212, 0.55); }
    .hl-purple { background: rgba(196, 181, 253, 0.60); }

    .notice {
      font-size: 13px;
      color: var(--muted);
      padding: 8px 10px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <select id="color">
      <option value="yellow">Amarelo</option>
      <option value="green">Verde</option>
      <option value="blue">Azul</option>
      <option value="pink">Rosa</option>
      <option value="purple">Roxo</option>
    </select>

    <button class="primary" id="btn-highlight">Destacar seleção</button>
    <button id="btn-delete">Apagar selecionado</button>
    <button class="danger" id="btn-clear">Apagar todos</button>

    <span class="status" id="status">Selecione um trecho para destacar.</span>
  </div>

  <div class="notice">
    Dica: para apagar um destaque específico, clique nele e depois em “Apagar selecionado”.
  </div>

  <main id="reader"></main>

  <script>
    const Streamlit = window.Streamlit;
    let componentArgs = {};
    let highlights = [];
    let selectedHighlightId = null;
    let docId = "";

    const reader = document.getElementById("reader");
    const colorSelect = document.getElementById("color");
    const statusEl = document.getElementById("status");

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function uid() {
      return "hl_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2);
    }

    function getTextNodes(root) {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node) {
          if (!node.nodeValue || node.nodeValue.trim() === "") return NodeFilter.FILTER_REJECT;
          const parent = node.parentElement;
          if (!parent) return NodeFilter.FILTER_REJECT;
          if (parent.closest(".toolbar")) return NodeFilter.FILTER_REJECT;
          if (parent.closest("script, style, noscript")) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });

      let nodes = [];
      let current;
      while (current = walker.nextNode()) nodes.push(current);
      return nodes;
    }

    function getAbsoluteOffset(container, node, offset) {
      const nodes = getTextNodes(container);
      let total = 0;
      for (const n of nodes) {
        if (n === node) return total + offset;
        total += n.nodeValue.length;
      }
      return null;
    }

    function getRangeOffsets(container, range) {
      const start = getAbsoluteOffset(container, range.startContainer, range.startOffset);
      const end = getAbsoluteOffset(container, range.endContainer, range.endOffset);
      if (start === null || end === null) return null;
      return {
        start: Math.min(start, end),
        end: Math.max(start, end)
      };
    }

    function makeRangeFromOffsets(container, start, end) {
      const nodes = getTextNodes(container);
      let current = 0;
      let startNode = null, startOffset = 0, endNode = null, endOffset = 0;

      for (const node of nodes) {
        const len = node.nodeValue.length;
        const next = current + len;

        if (startNode === null && start >= current && start <= next) {
          startNode = node;
          startOffset = start - current;
        }

        if (endNode === null && end >= current && end <= next) {
          endNode = node;
          endOffset = end - current;
          break;
        }

        current = next;
      }

      if (!startNode || !endNode) return null;
      const range = document.createRange();
      range.setStart(startNode, startOffset);
      range.setEnd(endNode, endOffset);
      return range;
    }

    function unwrapHighlights() {
      const spans = Array.from(reader.querySelectorAll("span.med-highlight"));
      for (const span of spans) {
        const parent = span.parentNode;
        while (span.firstChild) parent.insertBefore(span.firstChild, span);
        parent.removeChild(span);
        parent.normalize();
      }
    }

    function applyHighlight(h) {
      const range = makeRangeFromOffsets(reader, h.start, h.end);
      if (!range || range.collapsed) return;

      const span = document.createElement("span");
      span.className = `med-highlight hl-${h.color || "yellow"}`;
      span.dataset.id = h.id;
      span.title = "Clique para selecionar este destaque";
      try {
        range.surroundContents(span);
      } catch (err) {
        // Fallback para seleções atravessando múltiplos elementos.
        const frag = range.extractContents();
        span.appendChild(frag);
        range.insertNode(span);
      }
    }

    function renderHighlights() {
      unwrapHighlights();
      selectedHighlightId = null;
      // aplicar de trás para frente reduz deslocamento quando insere spans
      const sorted = [...highlights].sort((a, b) => b.start - a.start);
      for (const h of sorted) applyHighlight(h);
      attachHighlightEvents();
      setStatus(`${highlights.length} destaque(s) salvo(s).`);
    }

    function attachHighlightEvents() {
      reader.querySelectorAll(".med-highlight").forEach(span => {
        span.addEventListener("click", (e) => {
          e.stopPropagation();
          reader.querySelectorAll(".med-highlight").forEach(s => s.classList.remove("selected"));
          span.classList.add("selected");
          selectedHighlightId = span.dataset.id;
          setStatus("Destaque selecionado. Clique em “Apagar selecionado” para remover.");
        });
      });
    }

    function sendValue(eventName) {
      Streamlit.setComponentValue({
        event: eventName,
        doc_id: docId,
        highlights: highlights
      });
    }

    function highlightSelection() {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) {
        setStatus("Selecione um trecho do texto primeiro.");
        return;
      }

      const range = selection.getRangeAt(0);
      if (!reader.contains(range.commonAncestorContainer)) {
        setStatus("Selecione um trecho dentro do ebook.");
        return;
      }

      const selectedText = selection.toString();
      if (!selectedText.trim()) {
        setStatus("A seleção está vazia.");
        return;
      }

      const offsets = getRangeOffsets(reader, range);
      if (!offsets || offsets.end <= offsets.start) {
        setStatus("Não consegui identificar a posição do trecho selecionado.");
        return;
      }

      const newHighlight = {
        id: uid(),
        start: offsets.start,
        end: offsets.end,
        text: selectedText,
        color: colorSelect.value,
        created_at: new Date().toISOString()
      };

      highlights.push(newHighlight);
      selection.removeAllRanges();
      renderHighlights();
      sendValue("changed");
    }

    function deleteSelected() {
      if (!selectedHighlightId) {
        setStatus("Clique primeiro em um destaque para selecioná-lo.");
        return;
      }

      highlights = highlights.filter(h => h.id !== selectedHighlightId);
      selectedHighlightId = null;
      renderHighlights();
      sendValue("delete_selected");
    }

    function clearAll() {
      if (!confirm("Apagar todos os destaques deste ebook?")) return;
      highlights = [];
      selectedHighlightId = null;
      renderHighlights();
      sendValue("delete_all");
    }

    document.getElementById("btn-highlight").addEventListener("click", highlightSelection);
    document.getElementById("btn-delete").addEventListener("click", deleteSelected);
    document.getElementById("btn-clear").addEventListener("click", clearAll);

    reader.addEventListener("click", () => {
      reader.querySelectorAll(".med-highlight").forEach(s => s.classList.remove("selected"));
      selectedHighlightId = null;
    });

    function onRender(event) {
      componentArgs = event.detail.args || {};
      const html = componentArgs.html || "";
      docId = componentArgs.doc_id || "";
      highlights = Array.isArray(componentArgs.highlights) ? componentArgs.highlights : [];

      reader.innerHTML = html;
      renderHighlights();

      const height = componentArgs.height || 800;
      Streamlit.setFrameHeight(height);
    }

    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(820);
  </script>
</body>
</html>
